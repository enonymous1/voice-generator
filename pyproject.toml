[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ss-voice-generator"
# Single source of truth: voice_generator.__version__. (Previously the
# version lived in both places and could drift — the 0.3.0 release had
# them in sync only by hand.)
dynamic = ["version"]
description = "Local, FOSS voice cloning from a text script — Stage 1 of the AI Digital Twin pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
# Each real backend lives in its own extra (and, in practice, its own venv):
# Chatterbox, CosyVoice and Qwen3-TTS pin conflicting torch / CUDA stacks,
# so they are never installed into the same environment.
chatterbox = ["chatterbox-tts"]
qwen3 = ["qwen-tts"]
dev = ["pytest", "ruff"]

[project.scripts]
voice-gen = "voice_generator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "voice_generator.__version__" }

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# E/F: errors; W: whitespace; I: import order (the old cli.py hid imports
# mid-function, which isort now catches); UP: pyupgrade for the 3.10 floor;
# B: bugbear (e.g. mutable defaults, bare except). Deliberately NOT
# format-enforced: ruff format would reflow every file in one noisy diff.
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
