[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-generator"
# Single source of truth: voice_generator.__version__. (Previously the
# version lived in both places and could drift — the 0.3.0 release had
# them in sync only by hand.)
dynamic = ["version"]
description = "Local, FOSS voice cloning from a text script — Stage 1 of the AI Digital Twin pipeline"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "MIT" }
dependencies = []

# PEP 621 project links (the repo now exists — added 2026-11-18; the
# old staff review had deferred this until the remote existed).
[project.urls]
Homepage = "https://enonymous1.github.io/voice-generator/"
Repository = "https://github.com/enonymous1/voice-generator"

[project.optional-dependencies]
# Each real backend lives in its own extra (and, in practice, its own venv):
# Chatterbox, CosyVoice, Qwen3-TTS and VoxCPM2 pin conflicting torch /
# CUDA stacks, so they are never installed into the same environment.
# setuptools<81: Chatterbox Turbo's watermarking dep (resemble-perth)
# imports pkg_resources, which setuptools removed in 81. perth swallows
# that ImportError and sets PerthImplicitWatermarker = None, so
# ChatterboxTurboTTS.from_pretrained then fails at load time with the
# opaque "TypeError: 'NoneType' object is not callable" (first seen on
# the target Windows box, 2026-11-09, after a successful 4 GB download).
# Keep the pin until upstream perth drops the pkg_resources import.
chatterbox = ["chatterbox-tts", "setuptools<81"]
qwen3 = ["qwen-tts"]
# VoxCPM2 needs Python 3.10–<3.13, PyTorch >= 2.5, CUDA >= 12 — the venv
# installs a CUDA torch build first (see SETUP.md), same as the Qwen3
# venv; this extra only adds the voxcpm package itself.
voxcpm = ["voxcpm"]
# Backend packages (chatterbox-tts, qwen-tts, voxcpm, torch) are
# deliberately unpinned here: the known-good versions live in the
# per-backend venvs on the target Windows box, not in this repo.
# Record them there, one venv at a time, with e.g.:
#   .venv-qwen3\Scripts\python.exe -m pip freeze
# and pin them here once recorded. Do NOT guess versions — a wrong pin
# is worse than none.
# The local web UI (voice-gen serve): Flask + Jinja2, localhost only.
# Kept out of the core so the CLI stays dependency-free. markdown
# renders the research report on the Research page (and in freeze).
# Pinned to the versions verified on the dev box (Flask 3.1.3,
# Markdown 3.11.3): >=x,<next-major, so a fresh install cannot pull a
# breaking major.
web = ["flask>=3.1,<4", "markdown>=3.11,<4"]
dev = ["pytest>=9,<10", "ruff>=0.17,<0.18"]

[project.scripts]
voice-gen = "voice_generator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# The web UI's templates and static files must ship in the wheel:
# Flask resolves them relative to the installed package, so a wheel
# without them serves nothing (TemplateNotFound on the first request).
# Without this stanza only .py files were packaged. MANIFEST.in covers
# the sdist side.
[tool.setuptools.package-data]
"voice_generator.web" = ["templates/*.html", "static/*"]

[tool.setuptools.dynamic]
version = { attr = "voice_generator.__version__" }

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# E/F: errors; W: whitespace; I: import order (the old cli.py hid imports
# mid-function, which isort now catches); UP: pyupgrade for the 3.10 floor;
# B: bugbear (e.g. mutable defaults, bare except). Deliberately NOT
# format-enforced: ruff format would reflow every file in one noisy diff.
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
