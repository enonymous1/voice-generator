# Pages: deploy the static site in `site/` to GitHub Pages.
# The test suite runs first, so a broken build never publishes.
# One-time setup (after the first push): Settings -> Pages ->
# Source: GitHub Actions. Until that is set, pushes deploy nothing.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -e ".[dev,web]"
      - run: ruff check src tests tools setup
      - run: pytest -q
      # The committed site/ must be a fresh freeze: a template change
      # pushed without re-running `voice-gen freeze` would otherwise
      # deploy stale pages while every gate passes. Freeze to a temp
      # dir (never in place — that would clobber real samples) and
      # diff; the freeze is deterministic, so any diff is a stale site.
      # .gitkeep is excluded: it is a repo placeholder so the empty
      # samples/ dir is tracked, and the freeze never writes it.
      - run: voice-gen freeze --out /tmp/frozen-check --seed-mock
      - run: diff -r --exclude=.gitkeep /tmp/frozen-check site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
